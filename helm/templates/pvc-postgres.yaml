{{- if and .Values.postgres.enabled .Values.pvc.postgresData.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "request-tracker.fullname" . }}-postgres-data
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "request-tracker.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.pvc.postgresData.accessMode }}
  resources:
    requests:
      storage: {{ .Values.pvc.postgresData.size }}
  {{- if .Values.pvc.postgresData.storageClass }}
  storageClassName: {{ .Values.pvc.postgresData.storageClass }}
  {{- end }}
{{- end }}
