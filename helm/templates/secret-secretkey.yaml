{{- if and .Values.secretKey.value (not .Values.secretKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "request-tracker.secretKeySecretName" . }}
  labels:
    {{- include "request-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  secretKey: {{ .Values.secretKey.value | quote }}
{{- end }}
