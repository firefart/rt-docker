apiVersion: v1
kind: Service
metadata:
  name: {{ include "request-tracker.mailgateName" . }}
  labels:
    {{- include "request-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.caddy.service.mailgatePort }}
      targetPort: mailgate
      protocol: TCP
      name: mailgate
  selector:
    {{- include "request-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rt
